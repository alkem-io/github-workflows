# Reusable Go CI: lint, race-enabled unit tests, optional build check,
# optional generated-artifact staleness gates (sqlc, OpenAPI via apispec),
# optional extra build-tagged test suite (e.g. vips), and an optional caller-owned setup script for
# repositories that need native build dependencies.
#
# Tool version pins live HERE, once, for the whole org. Bump them in this
# repo and every caller picks the change up via the @v1 tag.
name: Go CI

on:
  workflow_call:
    inputs:
      go-test-flags:
        description: Flags passed to `go test`
        type: string
        default: '-race -count=1'
      coverage:
        description: Collect a coverage profile and emit a summary
        type: boolean
        default: true
      coverage-min:
        description: Minimum total statement coverage percentage; 0 disables the gate
        type: number
        default: 0
      golangci-lint-version:
        description: golangci-lint version (org default pinned here)
        type: string
        default: v2.12.2
      run-vet:
        description: Run `go vet ./...` before lint
        type: boolean
        default: false
      run-build:
        description: Run a `go build ./...` check job
        type: boolean
        default: true
      setup-script:
        description: Repo-relative committed script run before Go analysis/build steps; empty skips
        type: string
        default: ''
      sqlc-version:
        type: string
        default: v1.30.0
      sqlc-config:
        description: Path to the sqlc config (e.g. sqlc.yaml or db/sqlc.yaml); empty skips the sqlc-check job
        type: string
        default: ''
      sqlc-generated-path:
        description: Path whose cleanliness proves generated code is fresh; empty diffs the whole tree
        type: string
        default: ''
      apispec-version:
        description: antst/go-apispec version for OpenAPI regeneration
        type: string
        default: v0.4.25
      openapi-make-target:
        description: Make target that regenerates the OpenAPI spec; empty skips the openapi job
        type: string
        default: ''
      openapi-file:
        description: Generated spec file checked for staleness
        type: string
        default: openapi.yaml
      extra-suite-tags:
        description: Build tags for an additional test-suite job (e.g. "vips"); empty skips
        type: string
        default: ''
      extra-suite-apt:
        description: apt packages the extra suite needs (space-separated)
        type: string
        default: ''

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run repository setup
        env:
          SETUP_SCRIPT: ${{ inputs.setup-script }}
        run: |
          test -z "$SETUP_SCRIPT" || {
            case "$SETUP_SCRIPT" in /*|../*|*/../*) echo "::error::setup-script must be a repo-relative path"; exit 1;; esac
            if [ ! -f "$SETUP_SCRIPT" ] || [ -L "$SETUP_SCRIPT" ]; then
              echo "::error::setup-script must name a committed regular file"
              exit 1
            fi
            git ls-files --error-unmatch -- "$SETUP_SCRIPT" >/dev/null 2>&1 || {
              echo "::error::setup-script must name a committed regular file"
              exit 1
            }
            bash -- "$SETUP_SCRIPT"
          }

      - name: go vet
        if: inputs.run-vet
        run: go vet ./...

      - name: Install lint build-tag dependencies
        # When linting build-tagged files (e.g. vips), golangci-lint compiles the
        # tagged cgo packages, which need the same system libs the extra suite
        # does — install them here too, not just in the test-extra job.
        if: inputs.extra-suite-tags != '' && inputs.extra-suite-apt != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ inputs.extra-suite-apt }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          # Include build-tagged files (e.g. vips) — without this, tagged code
          # is invisible to lint even though the extra suite tests it.
          args: ${{ inputs.extra-suite-tags != '' && format('--build-tags {0}', inputs.extra-suite-tags) || '' }}

  test-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate coverage configuration
        env:
          COVERAGE_MIN: ${{ inputs.coverage-min }}
          COVERAGE_ENABLED: ${{ inputs.coverage }}
        run: |
          if [[ ! "$COVERAGE_MIN" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::coverage-min must be a non-negative number"
            exit 1
          fi
          if [ "$COVERAGE_ENABLED" != "true" ] \
            && awk -v minimum="$COVERAGE_MIN" 'BEGIN { exit !((minimum + 0) > 0) }'; then
            echo "::error::coverage-min requires coverage to be enabled"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run repository setup
        env:
          SETUP_SCRIPT: ${{ inputs.setup-script }}
        run: |
          test -z "$SETUP_SCRIPT" || {
            case "$SETUP_SCRIPT" in /*|../*|*/../*) echo "::error::setup-script must be a repo-relative path"; exit 1;; esac
            if [ ! -f "$SETUP_SCRIPT" ] || [ -L "$SETUP_SCRIPT" ]; then
              echo "::error::setup-script must name a committed regular file"
              exit 1
            fi
            git ls-files --error-unmatch -- "$SETUP_SCRIPT" >/dev/null 2>&1 || {
              echo "::error::setup-script must name a committed regular file"
              exit 1
            }
            bash -- "$SETUP_SCRIPT"
          }

      - name: Run tests
        run: |
          flags="${{ inputs.go-test-flags }}"
          if [ "${{ inputs.coverage }}" = "true" ]; then
            flags="$flags -coverprofile=coverage.out -covermode=atomic"
          fi
          go test $flags ./...

      - name: Coverage summary
        if: inputs.coverage
        env:
          COVERAGE_MIN: ${{ inputs.coverage-min }}
        run: |
          total=$(go tool cover -func=coverage.out | tail -1)
          echo "$total"
          echo "**Coverage:** \`$total\`" >> "$GITHUB_STEP_SUMMARY"
          percent=$(printf '%s\n' "$total" | awk '{gsub(/%/, "", $3); print $3}')
          if [[ ! "$percent" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::could not parse total coverage from: $total"
            exit 1
          fi
          if [ "$COVERAGE_MIN" != "0" ] && ! awk -v actual="$percent" -v minimum="$COVERAGE_MIN" 'BEGIN { exit !((actual + 0) >= (minimum + 0)) }'; then
            echo "::error::coverage below configured minimum: ${percent}% < ${COVERAGE_MIN}%"
            exit 1
          fi

  build:
    if: inputs.run-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run repository setup
        env:
          SETUP_SCRIPT: ${{ inputs.setup-script }}
        run: |
          test -z "$SETUP_SCRIPT" || {
            case "$SETUP_SCRIPT" in /*|../*|*/../*) echo "::error::setup-script must be a repo-relative path"; exit 1;; esac
            if [ ! -f "$SETUP_SCRIPT" ] || [ -L "$SETUP_SCRIPT" ]; then
              echo "::error::setup-script must name a committed regular file"
              exit 1
            fi
            git ls-files --error-unmatch -- "$SETUP_SCRIPT" >/dev/null 2>&1 || {
              echo "::error::setup-script must name a committed regular file"
              exit 1
            }
            bash -- "$SETUP_SCRIPT"
          }

      - name: Build
        run: go build ./...

  test-extra:
    if: inputs.extra-suite-tags != ''
    # Static name on purpose: GitHub does not evaluate `inputs.*` expressions
    # in the displayed name of a SKIPPED job — callers without an extra suite
    # were showing the raw `${{ ... }}` text in their checks list. The tags in
    # use are echoed by the run step for callers that do enable the suite.
    name: test-extra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run repository setup
        env:
          SETUP_SCRIPT: ${{ inputs.setup-script }}
        run: |
          test -z "$SETUP_SCRIPT" || {
            case "$SETUP_SCRIPT" in /*|../*|*/../*) echo "::error::setup-script must be a repo-relative path"; exit 1;; esac
            if [ ! -f "$SETUP_SCRIPT" ] || [ -L "$SETUP_SCRIPT" ]; then
              echo "::error::setup-script must name a committed regular file"
              exit 1
            fi
            git ls-files --error-unmatch -- "$SETUP_SCRIPT" >/dev/null 2>&1 || {
              echo "::error::setup-script must name a committed regular file"
              exit 1
            }
            bash -- "$SETUP_SCRIPT"
          }

      - name: Install suite dependencies
        if: inputs.extra-suite-apt != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ inputs.extra-suite-apt }}

      - name: Run tagged suite
        run: go test -tags '${{ inputs.extra-suite-tags }}' ${{ inputs.go-test-flags }} ./...

  sqlc-check:
    # sqlc generates from its config/schema without compiling the caller's Go packages.
    if: inputs.sqlc-config != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install sqlc
        # Pinned ≤ v1.30.0 territory deliberately: sqlc ≥ 1.31.1 requires Go 1.26;
        # bump together with the org's oldest go.mod.
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ inputs.sqlc-version }}

      - name: Verify generated code is fresh
        run: |
          sqlc -f '${{ inputs.sqlc-config }}' generate
          target='${{ inputs.sqlc-generated-path }}'
          if [ -n "$target" ]; then
            git diff --exit-code -- "$target" || { echo "::error::sqlc-generated code is stale — run 'sqlc generate' and commit"; exit 1; }
          else
            git diff --exit-code || { echo "::error::sqlc-generated code is stale — run 'sqlc generate' and commit"; exit 1; }
          fi

  openapi:
    if: inputs.openapi-make-target != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run repository setup
        env:
          SETUP_SCRIPT: ${{ inputs.setup-script }}
        run: |
          test -z "$SETUP_SCRIPT" || {
            case "$SETUP_SCRIPT" in /*|../*|*/../*) echo "::error::setup-script must be a repo-relative path"; exit 1;; esac
            if [ ! -f "$SETUP_SCRIPT" ] || [ -L "$SETUP_SCRIPT" ]; then
              echo "::error::setup-script must name a committed regular file"
              exit 1
            fi
            git ls-files --error-unmatch -- "$SETUP_SCRIPT" >/dev/null 2>&1 || {
              echo "::error::setup-script must name a committed regular file"
              exit 1
            }
            bash -- "$SETUP_SCRIPT"
          }

      - name: Install apispec
        run: go install github.com/antst/go-apispec/cmd/apispec@${{ inputs.apispec-version }}

      - name: Verify OpenAPI spec is fresh
        run: |
          make '${{ inputs.openapi-make-target }}'
          git diff --exit-code -- '${{ inputs.openapi-file }}' || { echo "::error::${{ inputs.openapi-file }} is stale — regenerate and commit"; exit 1; }
